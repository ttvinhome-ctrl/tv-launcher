name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan proyek (zip diekstrak otomatis jika diunggah apa adanya)
        run: |
          if [ -f app/build.gradle ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls -t *.zip 2>/dev/null | head -n1)
            [ -n "$Z" ] || { echo "Tidak ada proyek atau file .zip di repo"; exit 1; }
            unzip -oq "$Z" -d _src
            S=$(find _src -name settings.gradle | head -n1)
            [ -n "$S" ] || { echo "settings.gradle tidak ditemukan di zip"; exit 1; }
            echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - name: Ambil APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" DelOS-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: DelOS-TV-apk, path: DelOS-TV.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DelOS TV build ${{ github.run_number }}
          files: DelOS-TV.apk
